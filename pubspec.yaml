name: Erabeh
description: اپلیکیشن روستای ایراج با گالری تصاویر
publish_to: 'none'

version: 1.0.3+5  # ← تغییر به نسخه بالاتر

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  webview_flutter: ^4.10.0
  google_maps_flutter: ^2.14.0
  geolocator: ^10.1.1 
  url_launcher: ^6.3.2
  photo_view: ^0.14.0
  shamsi_date: ^1.1.1
  intl: ^0.20.2
  hijri: ^3.0.0
  html: ^0.15.4
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.8
  shared_preferences: ^2.5.4
  audioplayers: ^5.2.1
  wakelock_plus: ^1.4.0
  syncfusion_flutter_pdfviewer: ^32.1.22
  characters: ^1.2.0
  map_launcher: ^4.4.2
  path_provider: ^2.1.1
  just_audio: ^0.9.36
  shimmer: ^3.0.0
  share_plus: ^10.1.4
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.13.1

