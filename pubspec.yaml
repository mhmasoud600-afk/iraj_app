flutter_native_splash:
  color: "#ffffff"
  image: assets/images/iraj_logo.png
  android: true
  ios: true
  fullscreen: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/iraj_logo1.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/iraj_logo1.png"
  min_sdk_android: 21