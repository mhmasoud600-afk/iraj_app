workflows:
  default-workflow:
    name: Build App
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: دانلود فایل‌های assets از Dropbox
        script: |
          set -e
          echo "در حال دانلود فایل‌های صوتی و تصویری از Dropbox..."
          dropbox_link="https://www.dropbox.com/scl/fi/mix5b3cdh4bul32kwwrzl/assets.zip?rlkey=mf55v34gtlko6ioack03b6myy&st=8mb4g8ax&dl=1"
          curl -L -o assets.zip "$dropbox_link"
          mkdir -p assets
          unzip -o assets.zip -d assets/
          rm assets.zip
          echo "دانلود و استخراج فایل‌ها با موفقیت انجام شد!"

      - name: ساخت IPA بدون امضا (با xcodebuild و حذف xcconfig)
        script: |
          set -e
          echo "حذف پوشه ios قدیمی..."
          rm -rf ios

          echo "ایجاد پوشه ios جدید از پروژه موقت..."
          mkdir temp_project
          cp pubspec.yaml temp_project/
          cd temp_project
          flutter create --template=app .
          cd ..
          cp -R temp_project/ios .
          rm -rf temp_project

          echo "نصب وابستگی‌ها..."
          flutter pub get

          echo "افزودن platform :ios, '14.0' به Podfile..."
          echo "platform :ios, '14.0'" >> ios/Podfile

          echo "اجرای pod install..."
          cd ios
          pod install
          cd ..

          echo "حذف فایل‌های xcconfig (برای نادیده گرفتن تنظیمات امضای فلاتر)..."
          rm -f ios/Flutter/Release.xcconfig
          rm -f ios/Flutter/Debug.xcconfig

          echo "تنظیم مسیر فلاتر برای xcodebuild..."
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          export FLUTTER_ROOT

          echo "شروع ساخت نهایی با xcodebuild (غیرفعال‌سازی ۱۰۰٪ امضا)..."
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          cd ..

          echo "تبدیل فایل کامپایل شده به IPA..."
          mkdir -p Payload
          if [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            cp -r build/ios/Release-iphoneos/Runner.app Payload/
            zip -r unsigned_app.ipa Payload/
            echo "🎉 فایل unsigned_app.ipa با موفقیت ساخته شد!"
          else
            echo "خطا: فایل Runner.app پیدا نشد!"
            exit 1
          fi
    artifacts:
      - unsigned_app.ipa