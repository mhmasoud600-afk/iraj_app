workflows:
  default-workflow:
    name: Build App
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: دانلود و استخراج فایل‌های assets
        script: |
          set -e
          echo "در حال دانلود فایل‌های صوتی و تصویری از Dropbox..."
          dropbox_link="https://www.dropbox.com/scl/fi/mix5b3cdh4bul32kwwrzl/assets.zip?rlkey=mf55v34gtlko6ioack03b6myy&st=8mb4g8ax&dl=1"
          curl -L -o assets.zip "$dropbox_link"
          rm -rf assets
          unzip -o assets.zip
          rm assets.zip
          echo "فایل‌های assets با موفقیت در ریشه پروژه استخراج شدند!"

      - name: ساخت IPA بدون امضا (با کپی دستی assets و xcodebuild)
        script: |
          set -e
          echo "حذف پوشه ios قدیمی و ساخت ios تمیز..."
          rm -rf ios
          mkdir temp_project
          cp pubspec.yaml temp_project/
          cd temp_project
          flutter create --template=app .
          cd ..
          cp -R temp_project/ios .
          rm -rf temp_project

          echo "نصب وابستگی‌ها و تنظیم پلتفرم..."
          flutter pub get
          echo "platform :ios, '14.0'" >> ios/Podfile

          echo "اجرای pod install..."
          cd ios
          pod install
          cd ..

          echo "پاکسازی تنظیمات امضا..."
          sed -i '' 's/DevelopmentTeam = .*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;//g' ios/Runner.xcodeproj/project.pbxproj

          echo "ساخت فایل اپ (فقط کد برنامه) با xcodebuild..."
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          export FLUTTER_ROOT
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          cd ..

          APP_PATH="build/ios/Release-iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
             echo "خطا: فایل Runner.app ساخته نشد!"
             exit 1
          fi

          echo "✅ مرحله طلایی: کپی کردن دستی فایل‌های 113 مگابایتی assets به داخل برنامه..."
          mkdir -p "$APP_PATH/assets"
          cp -R assets/* "$APP_PATH/assets/"

          echo "تبدیل فایل نهایی به IPA (با تمام عکس‌ها و آهنگ‌ها)..."
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r unsigned_app.ipa Payload/
          echo "🎉 فایل unsigned_app.ipa با حجم کامل (شامل assets) با موفقیت ساخته شد!"
    artifacts:
      - unsigned_app.ipa