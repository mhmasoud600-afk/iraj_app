workflows:
  default-workflow:
    name: Build App
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: نصب و دانلود فایل‌های assets از Google Drive
        script: |
          echo "در حال نصب ابزار gdown برای دانلود مطمئن‌تر..."
          pip3 install gdown > /dev/null
          echo "در حال دانلود فایل‌های صوتی و تصویری..."
          gdown --id 1xDqY_3qDMngrkDVPZXagEs21UGD9DGSu -O assets.zip
          mkdir -p assets
          unzip -o assets.zip -d assets/
          rm assets.zip
          echo "دانلود و جایگذاری فایل‌ها با موفقیت انجام شد!"
      - name: ساخت IPA بدون نیاز به امضای اپل (روش تضمینی)
        script: |
          echo "شروع ساخت با xcodebuild و غیرفعال کردن کامل امضا..."
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          cd ..
          mkdir -p Payload
          cp -r build/ios/Release-iphoneos/Runner.app Payload/
          zip -r unsigned_app.ipa Payload/
          echo "🎉 فایل unsigned_app.ipa بدون امضا با موفقیت ساخته شد!"
    artifacts:
      - unsigned_app.ipa