workflows:
  default-workflow:
    name: Build App
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: دانلود فایل‌های assets از Dropbox
        script: |
          set -e
          echo "در حال دانلود فایل‌های صوتی و تصویری از Dropbox..."
          dropbox_link="https://www.dropbox.com/scl/fi/mix5b3cdh4bul32kwwrzl/assets.zip?rlkey=mf55v34gtlko6ioack03b6myy&st=8mb4g8ax&dl=1"
          curl -L -o assets.zip "$dropbox_link"
          mkdir -p assets
          unzip -o assets.zip -d assets/
          rm assets.zip
          echo "دانلود و استخراج فایل‌ها با موفقیت انجام شد!"

      - name: ساخت IPA بدون امضا (روش طوفانی و تضمینی)
        script: |
          set -e
          echo "حذف پوشه ios قدیمی و ساخت ios تمیز از پروژه موقت..."
          rm -rf ios
          mkdir temp_project
          cp pubspec.yaml temp_project/
          cd temp_project
          flutter create --template=app .
          cd ..
          cp -R temp_project/ios .
          rm -rf temp_project

          echo "نصب وابستگی‌ها..."
          flutter pub get
          echo "platform :ios, '14.0'" >> ios/Podfile

          echo "اجرای pod install..."
          cd ios
          pod install
          cd ..

          echo "پاکسازی نهایی تنظیمات امضا..."
          sed -i '' 's/DevelopmentTeam = .*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = .*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = .*;//g' ios/Runner.xcodeproj/project.pbxproj

          echo "تلاش برای ساخت با فلاتر (در صورت خطا، خودمان نجاتش می‌دهیم)..."
          flutter build ios --release --no-codesign || true

          echo "بررسی وجود فایل کامپایل شده..."
          APP_PATH=""
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/iphoneos/Runner.app"
            echo "فایل توسط فلاتر ساخته شد!"
          elif [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/Release-iphoneos/Runner.app"
            echo "فایل توسط xcodebuild ساخته شد!"
          else
            echo "فلاتر شکست خورد! ساخت اجباری با xcodebuild..."
            FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
            export FLUTTER_ROOT
            cd ios
            xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
            cd ..
            APP_PATH="build/ios/Release-iphoneos/Runner.app"
          fi

          echo "تبدیل فایل کامپایل‌شده به IPA..."
          mkdir -p Payload
          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
            zip -r unsigned_app.ipa Payload/
            echo "🎉 فایل unsigned_app.ipa با موفقیت ساخته شد و در Artifacts آماده است!"
          else
            echo "خطای بحرانی: فایل Runner.app در هیچ مسیری پیدا نشد!"
            exit 1
          fi
    artifacts:
      - unsigned_app.ipa