workflows:
  default-workflow:
    name: Build App
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: دانلود فایل‌های assets از Dropbox
        script: |
          set -e
          echo "در حال دانلود فایل‌های صوتی و تصویری از Dropbox..."
          dropbox_link="https://www.dropbox.com/scl/fi/mix5b3cdh4bul32kwwrzl/assets.zip?rlkey=mf55v34gtlko6ioack03b6myy&st=8mb4g8ax&dl=1"
          curl -L -o assets.zip "$dropbox_link"
          mkdir -p assets
          unzip -o assets.zip -d assets/
          rm assets.zip
          echo "دانلود و استخراج فایل‌ها با موفقیت انجام شد!"

      - name: ساخت IPA بدون امضا (با کپی pubspec به پروژه موقت)
        script: |
          set -e
          echo "ایجاد پروژه موقت برای تولید ios تمیز بر اساس pubspec اصلی..."
          mkdir temp_project
          # کپی کردن pubspec.yaml اصلی به پروژه موقت
          cp pubspec.yaml temp_project/
          cd temp_project
          # اجرای flutter create در پروژه موقت (با pubspec اصلی)
          flutter create --template=app .
          # پوشه ios اکنون با تنظیمات صحیح ساخته شده است
          cd ..
          # حذف پوشه ios قدیمی از پروژه اصلی
          rm -rf ios
          # کپی پوشه ios سالم از پروژه موقت به پروژه اصلی
          cp -R temp_project/ios .
          # حذف پروژه موقت
          rm -rf temp_project

          echo "نصب وابستگی‌ها بر اساس pubspec اصلی (که شامل assets است)..."
          flutter pub get

          echo "افزودن platform :ios, '14.0' به Podfile..."
          echo "platform :ios, '14.0'" >> ios/Podfile

          echo "اجرای pod install..."
          cd ios
          pod install
          cd ..

          echo "پاکسازی تنظیمات امضای اپل..."
          sed -i '' 's/DevelopmentTeam = .*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = .*;//g' ios/Runner.xcodeproj/project.pbxproj

          echo "شروع ساخت نهایی با Flutter build (غیرفعال‌سازی کامل امضا)..."
          flutter build ios --release --no-codesign

          mkdir -p Payload
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -r build/ios/iphoneos/Runner.app Payload/
            zip -r unsigned_app.ipa Payload/
            echo "🎉 فایل unsigned_app.ipa با موفقیت ساخته شد!"
          else
            echo "خطا: فایل Runner.app ساخته نشد!"
            exit 1
          fi
    artifacts:
      - unsigned_app.ipa