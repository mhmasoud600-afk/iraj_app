workflows:
  default-workflow:
    name: Build App
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: نصب gdown و دانلود فایل‌های assets
        script: |
          set -e  # توقف در صورت بروز خطا
          echo "نصب gdown..."
          pip3 install gdown > /dev/null
          echo "دانلود فایل‌های صوتی و تصویری با gdown..."
          gdown 1xDqY_3qDMngrkDVPZXagEs21UGD9DGSu -O assets.zip
          mkdir -p assets
          unzip -o assets.zip -d assets/
          rm assets.zip
          echo "دانلود و استخراج فایل‌ها با موفقیت انجام شد!"
      - name: ساخت IPA بدون امضا
        script: |
          set -e
          echo "شروع ساخت با xcodebuild (غیرفعال‌سازی کامل امضا)..."
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          cd ..
          mkdir -p Payload
          # بررسی وجود فایل اپلیکیشن
          if [ ! -d "build/ios/Release-iphoneos/Runner.app" ]; then
            echo "خطا: فایل Runner.app ساخته نشده است!"
            exit 1
          fi
          cp -r build/ios/Release-iphoneos/Runner.app Payload/
          zip -r unsigned_app.ipa Payload/
          echo "🎉 فایل unsigned_app.ipa با موفقیت ساخته شد!"
    artifacts:
      - unsigned_app.ipa