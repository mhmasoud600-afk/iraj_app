workflows:
  default-workflow:
    name: Build App
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: دانلود فایل‌های assets از Dropbox
        script: |
          set -e
          echo "در حال دانلود فایل‌های صوتی و تصویری از Dropbox..."
          dropbox_link="https://www.dropbox.com/scl/fi/mix5b3cdh4bul32kwwrzl/assets.zip?rlkey=mf55v34gtlko6ioack03b6myy&st=8mb4g8ax&dl=1"
          curl -L -o assets.zip "$dropbox_link"
          mkdir -p assets
          unzip -o assets.zip -d assets/
          rm assets.zip
          echo "دانلود و استخراج فایل‌ها با موفقیت انجام شد!"
      - name: ساخت IPA بدون امضا (با مسیر صحیح فلاتر)
        script: |
          set -e
          echo "شروع ساخت با xcodebuild و تنظیم مسیر فلاتر..."

          # پیدا کردن مسیر دقیق فلاتر در سرور کدمایک با استفاده از دستور which
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          echo "FLUTTER_ROOT به صورت دستی تنظیم شد: $FLUTTER_ROOT"
          export FLUTTER_ROOT

          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          cd ..

          mkdir -p Payload
          if [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            cp -r build/ios/Release-iphoneos/Runner.app Payload/
            zip -r unsigned_app.ipa Payload/
            echo "🎉 فایل unsigned_app.ipa با موفقیت ساخته شد!"
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -r build/ios/iphoneos/Runner.app Payload/
            zip -r unsigned_app.ipa Payload/
            echo "🎉 فایل unsigned_app.ipa با موفقیت ساخته شد!"
          else
            echo "خطا: فایل Runner.app در هیچ مسیری پیدا نشد!"
            exit 1
          fi
    artifacts:
      - unsigned_app.ipa