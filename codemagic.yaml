workflows:
  default-workflow:
    name: Build App
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: دانلود فایل‌های assets از Dropbox
        script: |
          set -e
          echo "در حال دانلود فایل‌های صوتی و تصویری از Dropbox..."
          dropbox_link="https://www.dropbox.com/scl/fi/mix5b3cdh4bul32kwwrzl/assets.zip?rlkey=mf55v34gtlko6ioack03b6myy&st=8mb4g8ax&dl=1"
          curl -L -o assets.zip "$dropbox_link"
          mkdir -p assets
          unzip -o assets.zip -d assets/
          rm assets.zip
          echo "دانلود و استخراج فایل‌ها با موفقیت انجام شد!"
      - name: ساخت IPA بدون امضا (با هک فایل پروژه Xcode)
        script: |
          set -e
          echo "شروع ساخت با Flutter build..."

          flutter pub get

          echo "حذف تنظیمات Development Team از فایل پروژه Xcode برای عبور از خطا..."
          # حذف خطوط مربوط به Development Team از فایل project.pbxproj (دستور مخصوص سرورهای مک)
          sed -i '' 's/DevelopmentTeam = .*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;//g' ios/Runner.xcodeproj/project.pbxproj

          echo "اجرای Flutter build با غیرفعال‌سازی کامل امضا..."
          flutter build ios --release --no-codesign

          mkdir -p Payload
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -r build/ios/iphoneos/Runner.app Payload/
            zip -r unsigned_app.ipa Payload/
            echo "🎉 فایل unsigned_app.ipa با موفقیت ساخته شد!"
          else
            echo "خطا: فایل Runner.app پیدا نشد!"
            exit 1
          fi
    artifacts:
      - unsigned_app.ipa