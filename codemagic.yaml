workflows:
  default-workflow:
    name: Build App
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: دانلود فایل‌های assets از Dropbox
        script: |
          set -e
          echo "در حال دانلود فایل‌های صوتی و تصویری از Dropbox..."
          dropbox_link="https://www.dropbox.com/scl/fi/mix5b3cdh4bul32kwwrzl/assets.zip?rlkey=mf55v34gtlko6ioack03b6myy&st=8mb4g8ax&dl=1"
          curl -L -o assets.zip "$dropbox_link"
          mkdir -p assets
          unzip -o assets.zip -d assets/
          rm assets.zip
          echo "دانلود و استخراج فایل‌ها با موفقیت انجام شد!"

      - name: ساخت IPA بدون امضا (با xcodebuild و پاکسازی کامل xcconfig)
        script: |
          set -e
          echo "بک‌آپ گرفتن از فایل pubspec.yaml اصلی..."
          cp pubspec.yaml pubspec.yaml.bak

          echo "حذف پوشه ios قدیمی..."
          rm -rf ios

          echo "ساخت مجدد پوشه ios بر اساس pubspec.yaml فعلی..."
          flutter create --template=app .

          echo "بازگرداندن فایل pubspec.yaml اصلی (برای حفظ تنظیمات assets)..."
          mv pubspec.yaml.bak pubspec.yaml

          echo "نصب وابستگی‌ها بر اساس فایل pubspec اصلی..."
          flutter pub get

          echo "افزودن platform :ios, '14.0' به Podfile..."
          echo "platform :ios, '14.0'" >> ios/Podfile

          echo "اجرای pod install بر اساس پلاگین‌های واقعی پروژه..."
          cd ios
          pod install
          cd ..

          echo "پاکسازی کامل فایل‌های xcconfig از هرگونه تنظیمات امضا..."
          sed -i '' 's/CODE_SIGN_IDENTITY=.*//g' ios/Flutter/Release.xcconfig || true
          sed -i '' 's/CODE_SIGN_STYLE=.*//g' ios/Flutter/Release.xcconfig || true
          sed -i '' 's/CODE_SIGN_IDENTITY=.*//g' ios/Flutter/Debug.xcconfig || true
          sed -i '' 's/CODE_SIGN_STYLE=.*//g' ios/Flutter/Debug.xcconfig || true

          echo "پاکسازی نهایی تنظیمات امضای اپل از فایل پروژه Xcode..."
          sed -i '' 's/DevelopmentTeam = .*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = .*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = .*;//g' ios/Runner.xcodeproj/project.pbxproj

          echo "تنظیم مسیر دقیق فلاتر برای اجرای xcodebuild..."
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          export FLUTTER_ROOT

          echo "شروع ساخت نهایی با xcodebuild (غیرفعال‌سازی ۱۰۰٪ امضا)..."
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos clean build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          cd ..

          mkdir -p Payload
          if [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            cp -r build/ios/Release-iphoneos/Runner.app Payload/
            zip -r unsigned_app.ipa Payload/
            echo "🎉 فایل unsigned_app.ipa با موفقیت ساخته شد!"
          else
            echo "خطا: فایل Runner.app ساخته نشد!"
            exit 1
          fi
    artifacts:
      - unsigned_app.ipa