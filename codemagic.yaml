workflows:
  default-workflow:
    name: Build App
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: دانلود فایل‌های assets از Google Drive
        script: |
          echo "در حال دانلود فایل‌های صوتی و تصویری..."
          gdrive_link="https://drive.google.com/uc?export=download&id=1xDqY_3qDMngrkDVPZXagEs21UGD9DGSu"
          curl -L -o assets.zip "$gdrive_link"
          mkdir -p assets
          unzip -o assets.zip -d assets/
          rm assets.zip
          echo "دانلود و جایگذاری فایل‌ها با موفقیت انجام شد!"
      - name: ساخت IPA بدون نیاز به امضای اپل
        script: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r unsigned_app.ipa Payload/
          echo "🎉 فایل unsigned_app.ipa بدون امضا با موفقیت ساخته شد!"
    artifacts:
      - unsigned_app.ipa