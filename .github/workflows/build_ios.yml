name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: دانلود فایل‌های assets از Dropbox
        run: |
          echo "در حال دانلود فایل‌های صوتی و تصویری..."
          curl -L -o assets.zip "https://www.dropbox.com/scl/fi/mix5b3cdh4bul32kwwrzl/assets.zip?rlkey=mf55v34gtlko6ioack03b6myy&st=8mb4g8ax&dl=1"
          rm -rf assets
          unzip -o assets.zip
          rm assets.zip
          echo "فایل‌ها با موفقیت استخراج شدند!"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build IPA without codesigning
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r unsigned_app.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned_app
          path: unsigned_app.ipa